<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Calculadora</h1>
      <h2>Simulador básico de operaciones</h2>
    </header>

    <main>
      <section id="calculator-container">
        <h3>Realiza un cálculo</h3>
        <form id="calculator-form">
          <div class="form-group">
            <label for="left-number">Primer número:</label>
            <input type="number" id="left-number" step="any" required />
          </div>
          <div class="form-group">
            <label for="operation">Operación:</label>
            <select id="operation" required>
              <option value="add">Sumar (+)</option>
              <option value="subtract">Restar (-)</option>
              <option value="multiply">Multiplicar (×)</option>
              <option value="divide">Dividir (÷)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="right-number">Segundo número:</label>
            <input type="number" id="right-number" step="any" required />
          </div>
          <button type="submit">Calcular</button>
        </form>
        <div id="result" class="result hidden"></div>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Calculadora Demo</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
